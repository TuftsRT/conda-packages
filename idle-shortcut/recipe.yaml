context:
  version: "2.0"

package:
  name: idle-shortcut
  version: ${{ version }}

build:
  number: 0
  skip:
    - not win

requirements:
  run:
    - menuinst >=2.5.0
    - python

tests:
  - script:
      - if not exist %PREFIX%\Menu\idle.json exit 1
      - if not exist %PREFIX%\Menu\idle.ico exit 1

about:
  homepage: https://github.com/TuftsRT/conda-packages
  summary: Start Menu shortcut for Python IDLE
  license: BSD-3-Clause
  license_file: LICENSE
