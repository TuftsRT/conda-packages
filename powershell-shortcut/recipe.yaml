context:
  version: 2.0.0
  build_number: 0
  ci_tag: ${{ env.get("CI_TAG", default="") }}

package:
  name: powershell-shortcut
  version: ${{ version }}

build:
  number: ${{ build_number }}
  skip:
    - not win
  string: >-
    ${{ hash }}_${{ build_number }}${{ '_' ~ ci_tag if ci_tag else '' }}

requirements:
  run:
    - menuinst >=2.5.0

tests:
  - script:
      - if not exist %PREFIX%\Menu\powershell-shortcut.json exit 1
      - if not exist %PREFIX%\Menu\powershell-shortcut.ico exit 1

about:
  homepage: https://github.com/TuftsRT/conda-packages
  summary: Shortcut to launch Windows PowerShell with conda activated.
  license: BSD-3-Clause
  license_file: LICENSE
