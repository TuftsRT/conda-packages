name: Manual Build

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe directory name to build.
        required: true

concurrency:
  group: manual-build-${{ github.ref_name }}-${{ inputs.recipe }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Reject manual builds from main
        if: github.ref_name == 'main'
        shell: bash
        run: |
          echo "::error::manual builds cannot be run from main" >&2
          exit 1
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: source
      - id: compute-label
        name: Compute label and CI tag
        shell: bash
        run: |
          source .github/scripts/_branch_slug.sh
          slug="$(branch_slug "$BRANCH")"
          echo "label=gh-${slug}" >> "$GITHUB_OUTPUT"
          echo "ci-tag=gh_${slug//-/_}" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
      - id: cache-rattler-build
        name: Cache rattler-build executable
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rattler-build
          key: rattler-build-${{ vars.RATTLER_BUILD_VERSION }}
      - name: Download rattler-build executable
        if: steps.cache-rattler-build.outputs.cache-hit != 'true'
        run: .github/scripts/get-rattler-build.sh
        shell: bash
        env:
          RATTLER_BUILD_DIR: ${{ runner.temp }}/rattler-build
          RATTLER_BUILD_VERSION: ${{ vars.RATTLER_BUILD_VERSION }}
      - name: Add rattler-build to PATH
        run: echo "$RATTLER_BUILD_DIR" >> "$GITHUB_PATH"
        shell: bash
        env:
          RATTLER_BUILD_DIR: ${{ runner.temp }}/rattler-build
      - name: Build ${{ inputs.recipe }}
        run: .github/scripts/run-rattler-build.sh
        shell: bash
        env:
          CI_TAG: ${{ steps.compute-label.outputs.ci-tag }}
          RECIPE_PATH: "source/${{ inputs.recipe }}/recipe.yaml"
      - name: Upload ${{ inputs.recipe }}
        run: .github/scripts/upload-to-anaconda.sh
        shell: bash
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
          ANACONDA_CHANNEL: ${{ steps.compute-label.outputs.label }}
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER }}
      - name: Summarize ${{ inputs.recipe }}
        run: .github/scripts/summarize-build.sh
        shell: bash
        env:
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER }}
          CHANNEL: ${{ steps.compute-label.outputs.label }}
          PACKAGE: ${{ inputs.recipe }}
